# Auto-generated by uf init. Customize as needed.
# This file is user-owned -- uf init will not
# overwrite it after initial creation.

sources:
  # Per-repo disk sources (fine-grained provenance)
  - id: disk-local
    type: disk
    name: website
    config:
      path: "."

  - id: disk-.github
    type: disk
    name: .github
    config:
      path: "../.github"

  - id: disk-containerfile
    type: disk
    name: containerfile
    config:
      path: "../containerfile"

  - id: disk-dewey
    type: disk
    name: dewey
    config:
      path: "../dewey"

  - id: disk-gaze
    type: disk
    name: gaze
    config:
      path: "../gaze"

  - id: disk-gaze-py
    type: disk
    name: gaze-py
    config:
      path: "../gaze-py"

  - id: disk-homebrew-tap
    type: disk
    name: homebrew-tap
    config:
      path: "../homebrew-tap"

  - id: disk-replicator
    type: disk
    name: replicator
    config:
      path: "../replicator"

  - id: disk-unbound-force
    type: disk
    name: unbound-force
    config:
      path: "../unbound-force"

  # Org-level files (design papers, plans)
  - id: disk-org
    type: disk
    name: org-workspace
    config:
      path: "../"
      recursive: false

  # GitHub API (issues, PRs, READMEs)
  - id: github-unbound-force
    type: github
    name: unbound-force org
    config:
      org: unbound-force
      repos:
        - website
        - .github
        - containerfile
        - dewey
        - gaze
        - gaze-py
        - homebrew-tap
        - replicator
        - unbound-force
    refresh_interval: daily
